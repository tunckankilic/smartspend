# Codemagic CI/CD — SmartSpend
# ─────────────────────────────────────────────────────────────────────────
# Two workflows (plus one on GitHub Actions):
#   • pr-check        — pull requests: lint, codegen, analyze, test, coverage
#                       gate, unsigned iOS build. (macOS)
#   • release         — push to `main` (PR merge) or `v*` tag: test, signed
#                       IPA, Sentry symbol upload, TestFlight upload.
#   • Backend Check   — NOT here: lives in .github/workflows/backend-check.yml
#                       (Supabase db lint + pgTAP need Docker; Codemagic macOS
#                       machines lack it and Linux isn't on the current plan).
#
# Supabase deploys (db push + Edge Function deploy) are MANUAL by design —
# the owner runs them from the dev machine while working on the code. See
# the "Manual Supabase deploy" reference at the bottom of this file.
#
# Secrets live in Codemagic environment groups, never in source. The group
# names referenced below (`supabase`, `sentry`, `appstore_connect`) must be
# created in the Codemagic UI with the variables listed in each `groups:`
# block. See README / the "Codemagic UI checklist" at the bottom of this file.
#
# Build-time secrets reach the app only via `--dart-define-from-file=.env`.
# The .env is reconstructed from environment-group variables in a pre-build
# script (it is git-ignored and never committed). The Flutter app receives
# only the anon key + public client IDs — never service_role or Gemini keys.
# ─────────────────────────────────────────────────────────────────────────

definitions:
  # Reusable shell snippet: rebuild .env from Codemagic env-group variables.
  # Keeps secrets out of source while feeding --dart-define-from-file=.env.
  scripts:
    - &write_env
      name: Reconstruct .env from environment groups
      script: |
        cat > "$CM_BUILD_DIR/.env" <<EOF
        SUPABASE_URL=$SUPABASE_URL
        SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY
        SENTRY_DSN=$SENTRY_DSN
        SENTRY_RELEASE=${SENTRY_RELEASE:-ci}
        SENTRY_ENVIRONMENT=${SENTRY_ENVIRONMENT:-production}
        APP_FLAVOR=production
        EOF
    - &github_token_for_private_pubs
      name: Authorize git for the private receipt_ocr dependency
      script: |
        # receipt_ocr is a private GitHub repo pulled as a git dependency.
        # GH_PAT is a fine-grained, read-only (Contents: Read) token scoped
        # to tunckankilic/receipt_ocr, stored in the `github` env group.
        # Fail fast with a clear message — without the token, pub get dies
        # later with an opaque git authentication error.
        if [ -z "${GH_PAT:-}" ]; then
          echo "ERROR: GH_PAT is not set. Create the 'github' environment"
          echo "group in Codemagic with a fine-grained read-only PAT for"
          echo "tunckankilic/receipt_ocr (see checklist at the bottom of"
          echo "codemagic.yaml)."
          exit 1
        fi
        git config --global \
          url."https://x-access-token:${GH_PAT}@github.com/".insteadOf \
          "https://github.com/"
    - &flutter_packages
      name: Get Flutter packages
      script: flutter pub get
    - &codegen
      name: Run build_runner (Drift + DI codegen)
      script: dart run build_runner build --delete-conflicting-outputs
    - &gen_l10n
      name: Generate localizations
      script: flutter gen-l10n

workflows:
  # ───────────────────────────────────────────────────────────────────────
  # pr-check — gate every pull request before it can merge.
  # ───────────────────────────────────────────────────────────────────────
  pr-check:
    name: PR Check
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      # Keep in lockstep with .fvmrc — `toolchain_pin_test.dart` fails the
      # suite when they drift. The test suite is measured on this version.
      flutter: 3.44.8
      xcode: latest
      groups:
        - supabase   # SUPABASE_URL, SUPABASE_ANON_KEY, SUPABASE_ACCESS_TOKEN,
                     # SUPABASE_PROJECT_REF
        - sentry     # SENTRY_DSN (shared) — only DSN needed here
        - github     # GH_PAT — read-only token for the private receipt_ocr
      vars:
        # Coverage gate. Local measurement (same lcov filtering) is 80.2%,
        # so the 80% project target is now enforced directly.
        COVERAGE_THRESHOLD: "80.0"
    triggering:
      events:
        - pull_request
      cancel_previous_builds: true
    scripts:
      - *write_env
      - *github_token_for_private_pubs
      - *flutter_packages
      - *codegen
      - *gen_l10n
      - name: Analyze (fatal-infos)
        script: flutter analyze --fatal-infos
      - name: Run tests with coverage
        script: flutter test --coverage
      - name: Install lcov
        script: |
          # Not preinstalled on Codemagic macOS images; needed by the two
          # coverage steps below.
          HOMEBREW_NO_AUTO_UPDATE=1 brew install lcov
      - name: Filter generated sources out of coverage
        script: |
          # --ignore-errors unused: lcov 2.x hard-fails when a pattern matches
          # nothing (e.g. no *.freezed.dart files exist in this project yet).
          lcov --remove coverage/lcov.info \
            '*.g.dart' '*.freezed.dart' '*.config.dart' '*.mocks.dart' \
            '*/l10n/generated/*' '*/generated/*' \
            --ignore-errors unused \
            -o coverage/lcov.cleaned.info
      - name: Coverage gate (>= $COVERAGE_THRESHOLD%, target 80%)
        script: |
          PCT=$(lcov --summary coverage/lcov.cleaned.info 2>&1 \
            | grep -i 'lines' | grep -oE '[0-9]+\.[0-9]+' | head -1)
          echo "Line coverage: ${PCT}% (threshold ${COVERAGE_THRESHOLD}%, target 80%)"
          awk -v p="$PCT" -v t="$COVERAGE_THRESHOLD" \
            'BEGIN { exit !(p+0 >= t+0) }' \
            || { echo "Coverage ${PCT}% below threshold ${COVERAGE_THRESHOLD}%"; exit 1; }
      - name: Build iOS (unsigned)
        script: |
          flutter build ios --no-codesign --dart-define-from-file=.env
    artifacts:
      - coverage/lcov.cleaned.info
      - build/ios/iphoneos/*.app

  # ───────────────────────────────────────────────────────────────────────
  # release — build, symbolicate, and ship to TestFlight on every merge to
  # `main` (or a `v*` tag).
  # ───────────────────────────────────────────────────────────────────────
  release:
    name: Release (TestFlight)
    instance_type: mac_mini_m2
    max_build_duration: 90
    environment:
      # Keep in lockstep with .fvmrc — see the note in `pr-check`.
      flutter: 3.44.8
      xcode: latest
      groups:
        - supabase
        - sentry            # SENTRY_DSN, SENTRY_AUTH_TOKEN, SENTRY_ORG,
                            # SENTRY_PROJECT
        - appstore_connect  # APP_STORE_CONNECT_* (managed by integration)
        - github            # GH_PAT — read-only token for receipt_ocr
      vars:
        BUNDLE_ID: "site.tunckankilic.smartspend"
        APP_STORE_APPLE_ID: "6768886898"
      ios_signing:
        distribution_type: app_store
        bundle_identifier: site.tunckankilic.smartspend
    integrations:
      app_store_connect: CodeMagic - SmartSpend  # p8 API key
    # CI shipping is now ADOPTED: every push to `main` (i.e. merging a PR)
    # builds a signed IPA and uploads it to TestFlight. Pushing a `v*` tag
    # still works as an alternative trigger — and the "Derive version" step
    # below refuses to build when the tag and pubspec.yaml disagree. App Store
    # *release* submission stays manual (see publishing.submit_to_app_store
    # below). Tagging a commit that already shipped produces one extra
    # TestFlight build with a fresh build number; harmless, see CONTRIBUTING.
    triggering:
      events:
        - push
        - tag
      branch_patterns:
        - pattern: main
          include: true
          source: true
      tag_patterns:
        - pattern: "v*"
          include: true
      cancel_previous_builds: true
    scripts:
      - *write_env
      - *github_token_for_private_pubs
      - *flutter_packages
      - *codegen
      - *gen_l10n
      - name: Derive version + build number
        script: |
          set -e
          # pubspec.yaml is the single source of truth for the version; a tag
          # may only confirm it, never override it.
          VERSION=$(grep '^version:' pubspec.yaml \
            | sed 's/version:[[:space:]]*//' | cut -d+ -f1)

          # Tag discipline gate. A `v*` tag pointing at a commit whose pubspec
          # says something else would ship a build labelled with a version the
          # source tree never carried — silently, since the old code took the
          # tag's word for it. Fail loudly instead.
          if [ -n "${CM_TAG:-}" ]; then
            case "$CM_TAG" in
              v[0-9]*.[0-9]*.[0-9]*) ;;
              *)
                echo "ERROR: tag '$CM_TAG' is not in vX.Y.Z form."
                exit 1
                ;;
            esac
            if [ "${CM_TAG#v}" != "$VERSION" ]; then
              echo "ERROR: tag '$CM_TAG' disagrees with pubspec.yaml ($VERSION)."
              echo "Tag the commit that carries the version, or fix pubspec."
              exit 1
            fi
          fi

          # BUILD is always the Codemagic project build counter (unique,
          # monotonic — ASC rejects duplicate build numbers per version).
          BUILD="$PROJECT_BUILD_NUMBER"
          echo "VERSION=$VERSION" >> "$CM_ENV"
          echo "BUILD=$BUILD" >> "$CM_ENV"
          echo "SENTRY_RELEASE=${VERSION}+${BUILD}" >> "$CM_ENV"
      - name: Run tests
        script: flutter test
      - name: Set up code signing
        script: |
          xcode-project use-profiles
      - name: Build signed IPA (with Dart debug symbols)
        script: |
          # --split-debug-info emits the Dart symbol files Sentry needs to
          # symbolicate Dart-level stack traces (not just native iOS frames).
          flutter build ipa --release \
            --build-name="$VERSION" \
            --build-number="$BUILD" \
            --split-debug-info=build/symbols \
            --dart-define=SENTRY_RELEASE="${VERSION}+${BUILD}" \
            --dart-define-from-file=.env \
            --export-options-plist=/Users/builder/export_options.plist
      - name: Upload symbols to Sentry (iOS dSYMs + Dart symbols)
        script: |
          # sentry_dart_plugin reads org/project from pubspec.yaml's `sentry:`
          # block and the auth token from SENTRY_AUTH_TOKEN (sentry env group).
          # SENTRY_RELEASE was exported above. Non-fatal: a symbol-upload hiccup
          # must not block shipping the build to TestFlight.
          export SENTRY_RELEASE="${VERSION}+${BUILD}"
          dart run sentry_dart_plugin || echo "WARN: Sentry symbol upload failed"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # App Store release submission stays MANUAL (review notes, screenshots,
        # privacy answers must be filled in App Store Connect first).
        submit_to_app_store: false

# ─────────────────────────────────────────────────────────────────────────
# Manual Supabase deploy — reference (run from the dev machine, NOT CI).
# Deploys are deliberately manual: migrations + function deploys touch shared
# prod state and the owner runs them alongside code changes.
#
#   supabase link --project-ref <ref>      # once per machine
#   supabase db push                       # apply new migrations
#   supabase functions deploy gemini-ocr-fallback
#   supabase functions deploy delete-account
#   supabase functions deploy apple-register
#   supabase functions deploy export-csv
#   supabase functions deploy export-pdf
#   # weekly-summary is DEFERRED from v1 — its Deno.serve entry-point is a
#   # commented-out stub. Deploy only after finishing it and applying
#   # supabase/cron/weekly_summary_cron.sql.
#
# Edge Function SECRETS are set once via `supabase secrets set …` — never in
# CI, so they never touch build logs: GEMINI_API_KEY,
# SUPABASE_SERVICE_ROLE_KEY, APPLE_PRIVATE_KEY_B64, APPLE_TEAM_ID,
# APPLE_KEY_ID, APPLE_CLIENT_ID (see docs/internal/APPLE_DELETE_SETUP.md).
# ─────────────────────────────────────────────────────────────────────────
# Codemagic UI checklist — environment-group variables to enter by hand
# (Settings → Environment variables → create these groups):
#
#   group "supabase"
#     SUPABASE_URL            prod project URL (https://<ref>.supabase.co)
#     SUPABASE_ANON_KEY       prod anon/publishable key (safe to ship)
#     SUPABASE_ACCESS_TOKEN   personal access token (deploy auth)  [secure]
#     SUPABASE_PROJECT_REF    prod project ref
#     (no GOOGLE_* vars — the app has no Google sign-in; auth is
#      email/password + Sign in with Apple only)
#
#   group "sentry"
#     SENTRY_DSN              client DSN
#     SENTRY_AUTH_TOKEN       upload token                          [secure]
#     (org/project live in pubspec.yaml's `sentry:` block — already set to
#      org: tuncsoftwareagency / project: smartspend; not secrets, no env var)
#
#   group "github"
#     GH_PAT                  fine-grained PAT, read-only (Contents: Read),
#                             scoped to tunckankilic/receipt_ocr     [secure]
#
#   group "appstore_connect"
#     Created automatically by the App Store Connect API key integration
#     ("CodeMagic - SmartSpend"): upload the p8, key id, issuer id.
#
# Also in the UI:
#   • Add the App Store Connect API key integration (p8) and reference it as
#     the `integrations.app_store_connect` name above.
#   • Code signing identities → iOS certificates: the SmartSpend distribution
#     certificate (.p12) is uploaded there; the matching "SmartSpend App
#     Store" profile lives in App Store Connect and is fetched automatically.
# ─────────────────────────────────────────────────────────────────────────
